[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inksweep"
dynamic = ["version"]                      # from src/inksweep/__init__.py
description = "GPU-resident ink-detection depth sweeps for Herculaneum scroll surface volumes, reproducing the PHerc. 343 First Letters recipe."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "KarLex AI, Inc." }]
requires-python = ">=3.11"
keywords = ["vesuvius-challenge", "herculaneum", "ink-detection", "papyrus", "x-ray-ct", "pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
]
# Core dependencies. torch (and torchvision, for the villa-family readers) is installed separately for the CUDA build
# of the host: see README, Quick start, and node/setup_inksweep.sh.
dependencies = [
    "numpy>=2.0",
    "tifffile>=2024.8.30",
    "imagecodecs>=2024.1.1",
    "zarr>=2.18,<4",
    "numcodecs>=0.15,<0.17",
    "opencv-python-headless>=4.10",
    "safetensors>=0.4",
    "scipy>=1.13",
]

[project.optional-dependencies]
# Readers built on the organisers' `vesuvius` package (ink_9um, dense_native, Reader v2/V3, d9v4C) need it importable;
# install it from ScrollPrize/villa at the pinned commit with --no-deps (README, Quick start) plus these packages.
villa = [
    "pillow>=11.3.0",
    "pynrrd>=1.1.3",
    "requests>=2.32.5",
    "pyyaml>=6.0.2",
    "fsspec>=2025.9.0",
    "s3fs>=2025.9.0",
    "cachetools>=6.2.4",
    "einops>=0.8.1",
    "timm>=1.0.20",
    "tqdm>=4.67.1",
    "huggingface-hub>=0.35.0",
]
# v8-in loads its model class from the model repository (ink8um), which needs huggingface_hub.
v8in = ["huggingface-hub>=0.35.0"]
render = ["s3fs>=2025.9.0", "fsspec>=2025.9.0"]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/inksweep/inksweep"
Issues = "https://github.com/inksweep/inksweep/issues"
Changelog = "https://github.com/inksweep/inksweep/blob/main/CHANGELOG.md"

[project.scripts]
inksweep = "inksweep.cli:main"

[tool.setuptools.dynamic]
version = { attr = "inksweep.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cuda: needs a CUDA device (skipped without one)"]
